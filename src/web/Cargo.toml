[package]
name = "web"
version.workspace = true
authors.workspace = true
edition.workspace = true

[features]
# Pass-throughs for the match engine features defined in `core`.
# Lets the parent binary forward `--features match-stub` etc. without
# spelling out `core/match-stub` on the command line.
match = ["match-logs", "match-stub"]
match-logs = ["core/match-logs"]
match-stub = ["core/match-stub"]

[dependencies]
shared = { path = "../shared" }
core = { path = "../core" }
database = { path = "../database" }
axum = "0.8.9"
log = "0.4.34"
tokio = { version = "1.53.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["fs", "catch-panic"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
chrono = "0.4.45"
itertools = "0.15.0"
askama = "0.16.0"
askama_web = { version = "0.16.0", features = ["axum-0.8"] }
rust-embed = "8.12"
mime_guess = "2.0.5"
flate2 = "1.1.10"
rayon = "1.12.0"
hostname = "0.4.2"
sysinfo = { version = "0.39.6", features = ["system"] }
bincode = { version = "2.0", features = ["serde"] }


# Compiles `src/match` (the Bevy replay viewer) to WebAssembly and stages it
# into `assets/`. The same helper backs `.dev/match`, so the harness and the
# server always serve the same viewer.
[build-dependencies]
match_viewer_build = { path = "../match/builder" }

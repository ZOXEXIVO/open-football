{% extends "layout.html" %}

{% block content %}
<div class="fm-page">
    <section class="fm-panel">
        <div class="fm-panel-head">
            <h3>{{ i18n.t("watchlist") }}</h3>
        </div>
        <div id="watchlist-rows"></div>
    </section>
</div>
{% endblock %}

{% block scripts %}
<script>
(function() {
    var container = document.getElementById('watchlist-rows');
    if (!container) return;
    var latest = 0;

    // Storage is pruned to the rows the server rendered, and only after it
    // answered: a failed request must never read as "every key is stale".
    function load() {
        var ticket = ++latest;
        fetch('/{{ lang }}/watchlist/rows', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ keys: OfWatchlist.keys() })
        })
            .then(function(res) { return res.ok ? res.text() : null; })
            .then(function(html) {
                if (html === null || ticket !== latest || !container.isConnected) return;
                container.innerHTML = html;
                var rendered = Array.prototype.map.call(
                    container.querySelectorAll('tr[data-watch-key]'),
                    function(row) { return row.dataset.watchKey; }
                );
                OfWatchlist.retain(rendered);
                document.dispatchEvent(new Event('content-refreshed'));
            })
            .catch(function() {});
    }

    container.addEventListener('click', function(e) {
        var btn = e.target.closest('.fm-watchlist-remove');
        if (!btn) return;
        OfWatchlist.remove(btn.dataset.watchKey);
        load();
    });

    load();
})();
</script>
{% endblock %}

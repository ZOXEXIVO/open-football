[package]
name = "match_viewer"
version = "0.1.0"
edition = "2024"
publish = false

# Deliberately excluded from the root workspace (see the root `Cargo.toml`
# `exclude` list): this crate only ever builds for `wasm32-unknown-unknown`
# with its own profile, and the web crate's `build.rs` drives that build
# through a nested `cargo` invocation with a separate target dir.

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Shared with the server, which is the whole point of it: the colour tables a
# player's complexion is drawn from have to be the same ones his portrait was
# drawn from, and an index that means "tone 8" here has to mean "tone 8"
# there. Carries no dependencies of its own — see its manifest.
shared = { path = "../shared" }
# Hand-picked rather than a feature collection: the collections drag in audio,
# glTF, sprites, gamepads and the desktop windowing backends, none of which a
# replay viewer in a browser tab has any use for.
# `default_font` is deliberately absent: it compiles in `FiraMono-subset.ttf`,
# which cannot spell half the squad list. `Typeface` fills the same slot with the
# faces the web UI uses — see `fonts/README.md`.
bevy = { version = "0.19", default-features = false, features = [
    "async_executor",
    "bevy_asset",
    "bevy_camera",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_image",
    "bevy_input_focus",
    "bevy_light",
    "bevy_log",
    "bevy_material",
    "bevy_mesh",
    "bevy_pbr",
    "bevy_render",
    "bevy_shader",
    "bevy_state",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_window",
    "bevy_winit",
    "keyboard",
    "ktx2",
    "mouse",
    "std",
    "tonemapping_luts",
    # A finger is not a mouse: winit reports one through `WindowEvent::Touch`,
    # and without this feature those messages have nowhere to land — every
    # gesture over the canvas would simply never arrive. It is also what inserts
    # `Touches`, which `bevy_ui`'s own focus system takes unconditionally, so it
    # is what makes a TAP on the transport bar register at all.
    "touch",
    "webgl2",
    "zstd_rust",
] }
# The rasteriser behind Bevy's own text, taken as a direct dependency so the
# print on the back of a shirt can be set in the SAME face as the label over
# the player's head — see `typeface::Stencil`. Costs nothing in the artefact:
# `bevy_text` already compiles it in, this only names it.
swash = "0.2"
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "console",
    "Headers",
    "Request",
    "RequestInit",
    "Response",
    "Window",
    # Real faces: a player's photograph (or the drawn portrait behind it) is
    # fetched as a blob, handed to the browser's own PNG/SVG decoder through an
    # image element, and read back off a canvas — see `portrait.rs`, which
    # explains why it goes the long way round rather than decoding in here.
    "Blob",
    "Url",
    "HtmlImageElement",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "ImageData",
    "MouseEvent",
    "WheelEvent",
    "KeyboardEvent",
    "AddEventListenerOptions",
    "Document",
    "Element",
    "EventTarget",
    # Focusing the canvas on load, so the flight keys answer the first press.
    "HtmlElement",
    "FocusOptions",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"

# `opt-level = "z"` over `3`: the replay viewer is not compute bound (a few
# hundred transform writes per frame) and every megabyte here is embedded
# into the web binary and shipped over the wire.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
